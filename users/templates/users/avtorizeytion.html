{% extends 'base.html' %}
{% block extra_ui %}
{% endblock %}
{%block content%}
<div class="page-login">
<div class="wrapper_window">
    <form action="{% url 'user:avtorizeytion' %}" method="post">
    {%csrf_token%}
        <h1>Login</h1>
        {%for item in form%}
        <div class="input-box">
            {{item}}
        </div>
        {%endfor%}
        <div class="remember-forgot">
            <label>
                <input type="checkbox"> Remember me
            </label>
            <a href="#">Forgot password?</a>
        </div>
        <button type="submit" class="btn">Login</button>
        <div class="register-link">
            <p>Don't have account?<a href="{%url 'users:registration' %}">Register</a><p>
        </div>
    </form>
</div>
</div>
{% endblock %}
