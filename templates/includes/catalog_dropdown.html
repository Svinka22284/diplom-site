{% load goods_tags %}
<div class="dropdown_meny_catalog">
    <button class="btn flash-btn" id="catalogBtn" type="button">
        Каталог товарів
    </button>
    <div class="dropdown_catalog_content" id="catalogMenu">
        {% tagcategories as categories %}
        {% for category in categories %}
            <a href="{% url 'catalog:index' category.slug %}">{{ category.name }}</a>
        {% endfor %}
    </div>
</div>
