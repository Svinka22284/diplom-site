<html lang="ru">

    <meta name="viewport"

    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Магазин</title>
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

<header class="main-header">
    <nav class="main-nav">
        <a href="#">Доставка та оплата</a>
        <a href="#">Контакти</a>
        <a href="#">Питання та відповіді</a>
        <a href="#">Знаходження магазинів</a>

        <a href="#" class="auth-link">Увійти</a>
        <a href="#" >Реєстрація</a>
    </nav>
</header>

<div class="content-wrapper">

    <aside class="left-sidebar">

        <button class="btn flash-btn">Каталог товарів</button>

 <div class="price-range">

    <div class="price-input">
        <div class="field">
            <span>Min</span>
            <input type="number" class="input-min" value="1000">
        </div>
        <div class="separator">-</div>
        <div class="field">
            <span>Max</span>
            <input type="number" class="input-max" value="8400">
        </div>
    </div>

    <div class="slider">
        <div class="progress"></div>
    </div>

    <div class="range-input">
        <input type="range" class="range-min" min="0" max="10000" value="1000" step="100">
        <input type="range" class="range-max" min="0" max="10000" value="8400" step="100">
    </div>
</div>


 <button class="btn flash-btn">Бренди</button>
    </aside>

</div>
