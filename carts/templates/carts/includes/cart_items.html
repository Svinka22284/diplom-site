{% for cart in carts %}

        <div class="cart-item">

            <img src="https://via.placeholder.com/80" alt="">

            <div class="cart-info">

                <h4>{{ cart.product.name }}</h4>

                <p>{{ cart.products_pice }}</p>

                <div class="qty-box">
                    <button  class="decrement" data-cart-id="{{cart.id}}" data-cart-change-url="{%url "cart:cart_change" %}">

                    -</button>

                    <span class="number">
                        {{ cart.quantity }}
                    </span>

                    <button  class="increment" data-cart-id="{{cart.id}}" data-cart-change-url="{%url "cart:cart_change" %}">

                    +</button>
                </div>

            </div>

            <a href="#"
   class="remove-from-cart"
   data-cart-id="{{ cart.id }}">
    🗑
</a>

        </div>

        {% endfor %}
